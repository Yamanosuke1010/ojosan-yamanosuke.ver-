<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>おじさんを怒らせるな | 顔ドッキリ・パーティーゲーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-outer:#F6C84B;
    --bg-outer-2:#F2B92E;
    --ink:#2B2118;
    --paper:#FFF8EA;
    --box:#C97B45;
    --box-dark:#9C5A2E;
    --box-light:#E3A268;
    --teal:#2F8F82;
    --red:#E8432F;
    --red-dark:#A8281A;
    --yellow-pop:#FFC93C;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    font-family:'Zen Maru Gothic', sans-serif;
    color:var(--ink);
    background:radial-gradient(circle at 50% -10%, var(--bg-outer-2), var(--bg-outer) 60%);
    -webkit-tap-highlight-color:transparent;
    overflow-x:hidden;
  }
  button{ font:inherit; color:inherit; }
  img{ max-width:100%; display:block; }

  #app{ max-width:640px; margin:0 auto; }

  .screen{ display:none; position:relative; min-height:100vh; padding:28px 18px 56px; }
  .screen.is-active{ display:block; animation:fadeIn .35s ease; }
  @keyframes fadeIn{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }

  .icon-btn{ background:var(--paper); border:none; border-radius:50%; width:42px; height:42px; font-size:1.15rem; box-shadow:0 3px 6px rgba(0,0,0,.15); cursor:pointer; flex:0 0 auto; }
  .icon-btn:active{ transform:scale(.92); }

  /* ---------- Top screen ---------- */
  .top-settings-btn{ position:absolute; top:18px; right:18px; }
  .top-card{ max-width:420px; margin:38px auto 0; }
  .eyebrow{ text-align:center; letter-spacing:.15em; font-size:.72rem; font-weight:700; color:var(--teal); margin:0 0 10px; }
  .title{ font-family:'M PLUS Rounded 1c', sans-serif; font-weight:900; text-align:center; letter-spacing:.03em; line-height:1.25; }
  .title.big-title{ font-size:clamp(2.1rem,10.5vw,3.3rem); margin:.05em 0 .5em; }
  .title-row{ display:block; }
  .title span{ display:inline-block; }
  .title span:nth-child(4n+1){ color:var(--red); transform:rotate(-5deg) translateY(-2px); }
  .title span:nth-child(4n+2){ color:var(--teal); transform:rotate(4deg) translateY(2px); }
  .title span:nth-child(4n+3){ color:var(--box-dark); transform:rotate(-3deg) translateY(1px); }
  .title span:nth-child(4n+4){ color:#7B4B94; transform:rotate(5deg) translateY(-1px); }
  .lead{ text-align:center; font-size:.92rem; line-height:1.7; margin:0 auto 6px; max-width:320px; }
  .lead strong{ color:var(--red); }

  .primary-btn{ display:block; width:100%; margin-top:24px; padding:.95em 1em; font-family:'M PLUS Rounded 1c', sans-serif; font-weight:800; font-size:1.08rem; color:#fff; background:linear-gradient(180deg,#FF6B4A,var(--red)); border:none; border-radius:999px; box-shadow:0 6px 0 var(--red-dark), 0 10px 18px rgba(0,0,0,.25); cursor:pointer; transition:transform .12s, box-shadow .12s; }
  .primary-btn:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--red-dark), 0 4px 8px rgba(0,0,0,.2); }
  .ghost-btn{ display:block; width:100%; margin-top:10px; padding:.8em 1em; font-family:'M PLUS Rounded 1c', sans-serif; font-weight:700; font-size:.95rem; color:var(--ink); background:transparent; border:2px solid var(--box-dark); border-radius:999px; cursor:pointer; }
  .ghost-btn:active{ transform:scale(.98); }

  /* ---------- Settings screen ---------- */
  .settings-topbar{ display:flex; align-items:center; justify-content:space-between; max-width:420px; margin:0 auto 18px; }
  .settings-heading{ font-family:'M PLUS Rounded 1c', sans-serif; font-weight:800; font-size:1.1rem; margin:0; }
  .icon-btn-spacer{ width:42px; height:42px; visibility:hidden; }
  .settings-card{ max-width:420px; margin:0 auto; }

  .photo-row{ display:flex; gap:14px; justify-content:center; }
  .photo-block{ flex:1 1 0; max-width:170px; text-align:center; }
  .photo-label{ font-family:'M PLUS Rounded 1c', sans-serif; font-weight:800; font-size:.8rem; margin:0 0 6px; }
  .photo-label.safe-label{ color:var(--teal); }
  .photo-label.angry-label{ color:var(--red); }

  .photo-slot{ display:block; width:100%; margin:0 auto; background:var(--paper); border:none; border-radius:6px; padding:8px 8px 20px; box-shadow:0 8px 18px rgba(0,0,0,.22); transform:rotate(-3deg); cursor:pointer; transition:transform .2s; }
  .photo-slot.angry-slot{ transform:rotate(3deg); }
  .photo-slot:hover{ transform:rotate(-1deg) scale(1.02); }
  .photo-slot.angry-slot:hover{ transform:rotate(1deg) scale(1.02); }
  .photo-slot:active{ transform:rotate(-1deg) scale(.97); }
  .photo-slot.angry-slot:active{ transform:rotate(1deg) scale(.97); }
  .photo-slot-inner{ width:100%; aspect-ratio:1/1; border-radius:4px; border:2px dashed var(--teal); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; overflow:hidden; background:#F3E9D2; }
  .angry-slot .photo-slot-inner{ border-color:var(--red); }
  .photo-slot-inner.has-image{ border-style:solid; }
  .photo-slot-inner img{ width:100%; height:100%; object-fit:cover; }
  .photo-icon{ font-size:1.6rem; }
  .photo-text{ font-family:'M PLUS Rounded 1c', sans-serif; font-size:.68rem; text-align:center; color:var(--box-dark); font-weight:700; line-height:1.35; padding:0 6px; }
  .photo-hint{ text-align:center; font-size:.74rem; color:var(--box-dark); margin:12px 0 20px; line-height:1.5; }

  .option-row{ display:flex; align-items:center; justify-content:space-between; margin:16px 4px; }
  .option-label{ font-family:'M PLUS Rounded 1c', sans-serif; font-weight:700; color:var(--box-dark); font-size:.95rem; }
  .stepper{ display:flex; align-items:center; gap:12px; }
  .step-btn{ width:34px; height:34px; border-radius:50%; border:none; background:var(--paper); box-shadow:0 3px 6px rgba(0,0,0,.18); font-size:1.25rem; line-height:1; cursor:pointer; }
  .step-btn:active{ transform:scale(.92); }
  .step-value{ min-width:1.6em; text-align:center; font-family:'M PLUS Rounded 1c', sans-serif; font-weight:800; font-size:1.15rem; }
  .segmented{ display:flex; gap:6px; }
  .seg-btn{ padding:.42em .75em; border-radius:10px; border:2px solid var(--box); background:var(--paper); font-family:'M PLUS Rounded 1c', sans-serif; font-weight:700; cursor:pointer; color:var(--box-dark); font-size:.92rem; }
  .seg-btn.is-selected{ background:var(--box); color:#fff; }

  /* ---------- Playing screen ---------- */
  .screen--playing{ padding:12px 8px 10px; overflow:visible; }
  .screen--playing.is-active{ display:flex; flex-direction:column; overflow:visible; }
  .playing-topbar{ max-width:none; width:100%; margin:0; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; flex:0 0 auto; }
  .badges{ display:flex; align-items:center; gap:8px; flex:1 1 auto; justify-content:center; flex-wrap:wrap; }
  .turn-badge{ font-family:'M PLUS Rounded 1c', sans-serif; font-weight:700; background:var(--teal); color:#fff; padding:.45em 1em; border-radius:999px; font-size:.88rem; }
  .remain-badge{ font-family:'M PLUS Rounded 1c', sans-serif; font-weight:700; background:var(--paper); color:var(--ink); padding:.45em 1em; border-radius:999px; font-size:.85rem; box-shadow:0 3px 6px rgba(0,0,0,.12); }

  .game-top-text{ text-align:center; font-family:'M PLUS Rounded 1c', sans-serif; font-weight:800; font-size:clamp(1rem,4.2vw,1.35rem); color:var(--red); margin:10px 0 6px; flex:0 0 auto; }
  .hint-text{ text-align:center; font-family:'M PLUS Rounded 1c', sans-serif; font-weight:700; color:var(--box-dark); font-size:.85rem; margin:8px 0 0; flex:0 0 auto; }

  .crate{ flex:1 1 auto; min-height:0; overflow:visible; display:flex; flex-direction:column; width:100%; max-width:420px; margin:0 auto; background:#fff; border:5px solid #e8e0d0; border-radius:12px; padding:8px; box-shadow:0 0 0 4px #9c6b3a, 0 10px 24px rgba(0,0,0,.25); position:relative; }
  .crate-grid{ flex:1 1 auto; display:grid; grid-template-columns:repeat(var(--cols,4), 1fr); align-content:center; gap:6px; }

  .cell{ position:relative; aspect-ratio:3/4; background:transparent; border:none; border-radius:10px; padding:0; cursor:pointer; transform:rotate(var(--tilt,0deg)); transition:transform .15s; user-select:none; -webkit-touch-callout:none; overflow:visible; }
  .cell:active{ transform:rotate(var(--tilt,0deg)) scale(.94); }
  .cell:focus-visible{ outline:3px solid var(--teal); outline-offset:3px; }

  /* 顔は最初から出したまま（画像と同じ） */
  .cell-content{ position:absolute; inset:0; z-index:2; display:flex; align-items:center; justify-content:center; opacity:1; transform:translateY(0); background:transparent; }
  .cell.is-flying{ z-index: 50; overflow: visible; }
  .cell.is-flying .cell-content{ 
    animation:slideUp .75s cubic-bezier(.25,.8,.25,1) forwards; 
    z-index: 50;
    pointer-events: none;
  }
  /* 画面外まで飛ぶクローン用 */
  .flying-face-clone{
    position: fixed !important;
    z-index: 99999 !important;
    pointer-events: none !important;
    margin: 0 !important;
    padding: 0 !important;
    border: none !important;
    object-fit: contain !important;
    will-change: transform;
    animation: flyOffScreen 1.4s cubic-bezier(0.22, 0.61, 0.36, 1) forwards !important;
  }
  @keyframes flyOffScreen{
    0%{ transform: translateY(0); opacity: 1; }
    100%{ transform: translateY(-160vh); opacity: 1; }
  }
  @keyframes slideUp{
    0%{ transform:translateY(0); }
    100%{ transform:translateY(-150vh); }  /* 画面を通り越して完全に見えなくなるまで上へ */
  }
  .cell.is-done .cell-content{ display:none; }

  .cell-empty{ position:absolute; inset:0; z-index:1; display:flex; align-items:center; justify-content:center; font-size:1.4rem; opacity:0; }
  .cell.is-done .cell-empty{ opacity:1; }

  .face-wrap{ width:100%; height:100%; border-radius:8px; overflow:visible; background:transparent; }
  .face-img{ width:100%; height:100%; object-fit:contain; }

  .speech-bubble{ position:absolute; top:-1.85em; left:50%; transform:translateX(-50%); background:var(--paper); color:var(--ink); font-family:'M PLUS Rounded 1c', sans-serif; font-weight:700; font-size:clamp(.55rem,2.4vw,.78rem); padding:.25em .6em; border-radius:999px; white-space:nowrap; box-shadow:0 2px 4px rgba(0,0,0,.2); opacity:0; transition:opacity .15s ease; z-index:5; }
  .speech-bubble::after{ content:""; position:absolute; bottom:-5px; left:50%; transform:translateX(-50%); border:5px solid transparent; border-top-color:var(--paper); }
  .cell.is-reacting .speech-bubble{ opacity:1; }

  .cell.is-angry .cell-content{ animation:angryShake .18s infinite; }
  @keyframes angryShake{
    0%,100%{ transform:translate(0,0) rotate(0); }
    10%{ transform:translate(-8px,3px) rotate(-8deg); }
    20%{ transform:translate(7px,-4px) rotate(7deg); }
    30%{ transform:translate(-6px,5px) rotate(-6deg); }
    40%{ transform:translate(8px,-2px) rotate(8deg); }
    50%{ transform:translate(-7px,4px) rotate(-7deg); }
    60%{ transform:translate(6px,-5px) rotate(6deg); }
    70%{ transform:translate(-5px,3px) rotate(-5deg); }
    80%{ transform:translate(7px,-3px) rotate(7deg); }
    90%{ transform:translate(-4px,2px) rotate(-4deg); }
  }

  body.is-shaking{ animation:bodyShake .45s; }
  @keyframes bodyShake{ 0%,100%{ transform:translateX(0); } 15%{ transform:translateX(-10px); } 30%{ transform:translateX(9px); } 45%{ transform:translateX(-7px); } 60%{ transform:translateX(7px); } 75%{ transform:translateX(-4px); } 90%{ transform:translateX(4px); } }

  /* ---------- Result screen：怒った顔を画面全体に表示（文字なし） ---------- */
  #screen-result{
    padding:0;
    overflow:hidden;
    align-items:center;
    justify-content:center;
    background:transparent;
    position: fixed;
    inset: 0;
    z-index: 1000;
    pointer-events: auto;
  }
  #screen-result.is-active{ display:flex; }
  .result-card{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    background:transparent;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0;
    border-radius:0;
    box-shadow:none;
    pointer-events: none; /* 顔以外は透過クリック可にする場合 */
  }
  .result-face-wrap{
    width:100%;
    height:100%;
    max-width:none;
    max-height:none;
    background:transparent;
    border:none;
    box-shadow:none;
    border-radius:0;
    overflow:visible;
    display:flex;
    align-items:center;
    justify-content:center;
    animation: popIn .4s cubic-bezier(.34,1.56,.64,1);
    pointer-events: auto;
  }
  @keyframes popIn{
    0%{ transform:scale(0.4); opacity:0; }
    70%{ transform:scale(1.05); opacity:1; }
    100%{ transform:scale(1); }
  }
  .result-face-wrap.is-shaking-result{
    animation: resultShake 2.0s ease-in-out;
  }
  @keyframes resultShake{
    /* 20度で4回揺れる */
    0%{ transform: rotate(0deg) scale(1); }
    8%{ transform: rotate(20deg) scale(1.02); }
    16%{ transform: rotate(-20deg) scale(1.02); }
    24%{ transform: rotate(20deg) scale(1.02); }
    32%{ transform: rotate(-20deg) scale(1.02); }
    40%{ transform: rotate(0deg) scale(1); }
    /* その後ドアップ3回 */
    48%{ transform: rotate(0deg) scale(1.25); }
    56%{ transform: rotate(0deg) scale(1); }
    64%{ transform: rotate(0deg) scale(1.3); }
    72%{ transform: rotate(0deg) scale(1); }
    80%{ transform: rotate(0deg) scale(1.35); }
    90%{ transform: rotate(0deg) scale(1.05); }
    100%{ transform: rotate(0deg) scale(1); }
  }
  .result-face{
    width:100%;
    height:100%;
    object-fit:contain;
    background:transparent;
  }
  /* （文字・枠・ボタンはHTMLから削除済み） */

  @media (prefers-reduced-motion: reduce){
    .cell-content, .speech-bubble{ transition-duration:.01ms !important; }
    .cell.is-flying .cell-content{ animation:none; }
    .cell.is-angry .cell-content{ animation:none; }
    body.is-shaking{ animation:none; }
    .result-face-wrap, .result-face-wrap.is-shaking-result{ animation:none; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- TOP SCREEN -->
  <section id="screen-top" class="screen is-active">
    <button type="button" id="open-settings-btn" class="icon-btn top-settings-btn" aria-label="設定を開く">⚙️</button>
    <div class="top-card">
      <p class="eyebrow">顔ドッキリ・パーティーゲーム</p>
      <h1 class="title big-title">
        <span class="title-row"><span>お</span><span>じ</span><span>さ</span><span>ん</span><span>を</span></span>
        <span class="title-row"><span>怒</span><span>ら</span><span>せ</span><span>る</span><span>な</span></span>
      </h1>
      <p class="lead">箱にはいろんなおじさんがぎっしり。<br>その中の<strong>たった1人</strong>だけ、<br>めちゃくちゃ怒るおじさんが混ざっているよ。</p>

      <div class="option-row" style="margin-top:18px;">
        <span class="option-label">人数</span>
        <div class="stepper">
          <button type="button" class="step-btn" id="player-minus" aria-label="人数を減らす">−</button>
          <span class="step-value" id="player-count">1</span>
          <button type="button" class="step-btn" id="player-plus" aria-label="人数を増やす">＋</button>
        </div>
      </div>

      <div class="option-row">
        <span class="option-label">箱の数</span>
        <div class="segmented" id="cell-count-group">
          <button type="button" class="seg-btn" data-count="9">9</button>
          <button type="button" class="seg-btn is-selected" data-count="16">16</button>
          <button type="button" class="seg-btn" data-count="20">20</button>
          <button type="button" class="seg-btn" data-count="25">25</button>
        </div>
      </div>

      <button type="button" id="start-btn" class="primary-btn">スタート</button>
    </div>
  </section>

  <!-- SETTINGS SCREEN -->
  <section id="screen-settings" class="screen">
    <div class="settings-topbar">
      <button type="button" id="settings-close-btn" class="icon-btn" aria-label="トップにもどる">←</button>
      <h2 class="settings-heading">せってい</h2>
      <span class="icon-btn-spacer"></span>
    </div>
    <div class="settings-card">

      <div class="photo-row">
        <div class="photo-block">
          <p class="photo-label safe-label">通常の顔</p>
          <button type="button" id="photo-slot-normal" class="photo-slot" aria-label="通常の顔写真を追加">
            <div class="photo-slot-inner" id="photo-preview-normal">
              <span class="photo-icon">🙂</span>
              <span class="photo-text">PNGのみ<br>顔を追加</span>
            </div>
          </button>
        </div>
        <div class="photo-block">
          <p class="photo-label angry-label">怒った顔</p>
          <button type="button" id="photo-slot-angry" class="photo-slot angry-slot" aria-label="怒った顔写真を追加">
            <div class="photo-slot-inner" id="photo-preview-angry">
              <span class="photo-icon">😠</span>
              <span class="photo-text">PNGのみ<br>顔を追加</span>
            </div>
          </button>
        </div>
      </div>
      <input type="file" id="photo-input-normal" accept="image/png" hidden>
      <input type="file" id="photo-input-angry" accept="image/png" hidden>
      <p class="photo-hint">透明背景のPNG画像のみ追加できます（追加しなくてもサンプル顔で遊べます）</p>
    </div>
  </section>

  <!-- PLAYING SCREEN -->
  <section id="screen-playing" class="screen screen--playing">
    <div class="playing-topbar">
      <button type="button" id="settings-back-btn" class="icon-btn" aria-label="トップに戻る">⚙️</button>
      <div class="badges">
        <div class="turn-badge" id="turn-badge" hidden><span id="turn-label">プレイヤー1</span>のばん</div>
        <div class="remain-badge">のこり <span id="remain-count">16</span></div>
      </div>
      <button type="button" id="mute-btn" class="icon-btn" aria-label="音を切り替える">🔊</button>
    </div>

    <p class="game-top-text">一人だけ怒るおじさんがいるよ</p>

    <div class="crate">
      <div class="crate-grid" id="crate-grid"></div>
    </div>

    <p class="hint-text">どのおじさんが怒るか触ってみよう</p>
  </section>

  <!-- RESULT SCREEN：怒った顔を画面全体に（文字なし） -->
  <section id="screen-result" class="screen">
    <div class="result-card">
      <div class="result-face-wrap">
        <img id="result-face" class="result-face" src="" alt="怒ったおじさんの顔">
      </div>
    </div>
  </section>

</div>

<canvas id="crop-canvas" hidden></canvas>

<script>
(function(){
  "use strict";

  var REACTIONS = ["やあ!","ういーす","ほい!","またね!","どうも!","べー!","よっ!","はろー!","おっす!","ばいばい!","げんき?","よいしょ!","おつかれ!","にひひ","わーい!","てへっ","ういっす","ちわっす","へーい!","じゃあね!"];
  var PLAYER_COLORS = ["#E8432F","#2F8F82","#3D6FB4","#C9A227","#7B4B94","#4C8C4A","#D4638B","#DD8A2E"];

  var els = {
    openSettingsBtn: document.getElementById('open-settings-btn'),
    settingsCloseBtn: document.getElementById('settings-close-btn'),
    photoSlotNormal: document.getElementById('photo-slot-normal'),
    photoInputNormal: document.getElementById('photo-input-normal'),
    photoPreviewNormal: document.getElementById('photo-preview-normal'),
    photoSlotAngry: document.getElementById('photo-slot-angry'),
    photoInputAngry: document.getElementById('photo-input-angry'),
    photoPreviewAngry: document.getElementById('photo-preview-angry'),
    playerMinus: document.getElementById('player-minus'),
    playerPlus: document.getElementById('player-plus'),
    playerCount: document.getElementById('player-count'),
    cellCountGroup: document.getElementById('cell-count-group'),
    startBtn: document.getElementById('start-btn'),
    settingsBackBtn: document.getElementById('settings-back-btn'),
    muteBtn: document.getElementById('mute-btn'),
    turnBadge: document.getElementById('turn-badge'),
    turnLabel: document.getElementById('turn-label'),
    remainCount: document.getElementById('remain-count'),
    crateGrid: document.getElementById('crate-grid'),
    resultFace: document.getElementById('result-face'),
    resultCard: document.querySelector('#screen-result .result-card'),
    cropCanvas: document.getElementById('crop-canvas')
  };

  var state = {
    normalFaceSrc: null,
    angryFaceSrc: null,
    numPlayers: 1,
    numCells: 16,
    players: [],
    currentPlayerIndex: 0,
    angryIndex: -1,
    openedSafe: 0,
    ended: false,
    muted: false
  };

  /* ---------- screen switching ---------- */
  function showScreen(id){
    var screens = document.querySelectorAll('.screen');
    for (var i = 0; i < screens.length; i++){
      screens[i].classList.toggle('is-active', screens[i].id === id);
    }
  }

  /* ---------- image helpers ---------- */
  function cropToPortraitDataURL(file){
    return new Promise(function(resolve, reject){
      // PNGのみ受け付ける
      if (file.type !== 'image/png') {
        alert('透明背景のPNG画像のみ追加できます。');
        reject(new Error('PNG only'));
        return;
      }
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          var targetRatio = 3 / 4;
          var sourceRatio = img.width / img.height;
          var sx, sy, sw, sh;
          if (sourceRatio > targetRatio){
            sh = img.height;
            sw = sh * targetRatio;
            sx = (img.width - sw) / 2;
            sy = 0;
          } else {
            sw = img.width;
            sh = sw / targetRatio;
            sx = 0;
            sy = (img.height - sh) / 2;
          }
          var outW = 360, outH = 480;
          var canvas = els.cropCanvas;
          canvas.width = outW;
          canvas.height = outH;
          var ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, outW, outH);
          ctx.drawImage(img, sx, sy, sw, sh, 0, 0, outW, outH);

          // 暗い背景を透明にする（デフォルト顔と同じ扱い）
          try {
            var imageData = ctx.getImageData(0, 0, outW, outH);
            var d = imageData.data;
            for (var i = 0; i < d.length; i += 4) {
              var r = d[i], g = d[i+1], b = d[i+2];
              // ほぼ黒〜暗いグレーを透明に
              if (r < 35 && g < 35 && b < 35) {
                d[i+3] = 0;
              }
            }
            ctx.putImageData(imageData, 0, 0);
          } catch (err) {}

          resolve(canvas.toDataURL('image/png'));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  var audioCtx = null;
  function ensureAudio(){
    if (!audioCtx){
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { audioCtx = null; }
    }
    return audioCtx;
  }
  function playPop(){
    if (state.muted) return;
    var ctx = ensureAudio();
    if (!ctx) return;
    var t = ctx.currentTime;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(720, t);
    osc.frequency.exponentialRampToValueAtTime(920, t + 0.08);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + 0.16);
  }
  function playBuzzer(){
    if (state.muted) return;
    var ctx = ensureAudio();
    if (!ctx) return;
    var t = ctx.currentTime;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(320, t);
    osc.frequency.exponentialRampToValueAtTime(90, t + 0.5);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.22, t + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t);
    osc.stop(t + 0.6);
  }

DHvw3MQZuvVQZNFbTGG5uA5bqNCXStJor1wBAb6P+9jjODBkoryqOxyLxWNZyqbk0PQzJKepKYBfR53Vcp0XiZ6vpMpQ9XC4lqrGXKqsoajqkYleoSjkiqhkghHQDohUKDiTaNKCxf0QgGCjhxEIvGPAGhFvSzwWKMmVTEFNRTMuMTAwVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV//PExAAAAANIAAAAAExBTUUzLjEwMFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVTEFNRTMuMTAwVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVV";
  var ojisanAudio = null;
  var yurusanaiAudio = null;
  function speakOjisan(){
    if (state.muted) return;
    try {
      if (!ojisanAudio) {
        ojisanAudio = new Audio(OJISAN_AUDIO_SRC);
        ojisanAudio.volume = 1;
      }
      ojisanAudio.currentTime = 0;
      ojisanAudio.play().catch(function(){});
    } catch(e) {}
  }
  function speakYurusanai(){
    if (state.muted) return;
    try {
      if (!yurusanaiAudio) {
        yurusanaiAudio = new Audio(YURUSANAI_AUDIO_SRC);
        yurusanaiAudio.volume = 1;
      }
      yurusanaiAudio.currentTime = 0;
      yurusanaiAudio.play().catch(function(){});
    } catch(e) {}
  }

  /* ---------- navigation ---------- */
  els.openSettingsBtn.addEventListener('click', function(){ showScreen('screen-settings'); });
  els.settingsCloseBtn.addEventListener('click', function(){ showScreen('screen-top'); });
  els.startBtn.addEventListener('click', startGame);
  // 怒った顔フルスクリーンをタップで再スタート
  if (els.resultCard) {
    els.resultCard.addEventListener('click', function(){ startGame(); });
  }
  els.settingsBackBtn.addEventListener('click', function(){
    if (window.confirm('トップにもどりますか？いまのゲームは終了します。')){
      showScreen('screen-top');
    }
  });
  els.muteBtn.addEventListener('click', function(){
    state.muted = !state.muted;
    els.muteBtn.textContent = state.muted ? '🔇' : '🔊';
  });

  /* ---------- settings interactions ---------- */
  function wirePhotoSlot(slotBtn, inputEl, previewEl, hintUpdater, onLoaded){
    slotBtn.addEventListener('click', function(){ inputEl.click(); });
    inputEl.addEventListener('change', function(e){
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      cropToPortraitDataURL(file).then(function(dataUrl){
        onLoaded(dataUrl);
        previewEl.classList.add('has-image');
        previewEl.innerHTML = '<img src="' + dataUrl + '" alt="追加した顔">';
        if (hintUpdater) hintUpdater();
      }).catch(function(){
        alert('画像の読み込みに失敗しました。別の画像でお試しください。');
      });
    });
  }
  wirePhotoSlot(els.photoSlotNormal, els.photoInputNormal, els.photoPreviewNormal, null, function(dataUrl){ state.normalFaceSrc = dataUrl; });
  wirePhotoSlot(els.photoSlotAngry, els.photoInputAngry, els.photoPreviewAngry, null, function(dataUrl){ state.angryFaceSrc = dataUrl; });
  els.playerMinus.addEventListener('click', function(){
    state.numPlayers = Math.max(1, state.numPlayers - 1);
    els.playerCount.textContent = state.numPlayers;
  });
  els.playerPlus.addEventListener('click', function(){
    state.numPlayers = Math.min(8, state.numPlayers + 1);
    els.playerCount.textContent = state.numPlayers;
  });

  var segButtons = els.cellCountGroup.querySelectorAll('.seg-btn');
  for (var s = 0; s < segButtons.length; s++){
    segButtons[s].addEventListener('click', function(){
      for (var j = 0; j < segButtons.length; j++){ segButtons[j].classList.remove('is-selected'); }
      this.classList.add('is-selected');
      state.numCells = parseInt(this.getAttribute('data-count'), 10);
    });
  }

  /* ---------- game logic ---------- */
  function startGame(){
    if (!state.normalFaceSrc){ state.normalFaceSrc = generateNormalPlaceholder(); }
    if (!state.angryFaceSrc){ state.angryFaceSrc = generateAngryPlaceholder(); }

    state.players = [];
    for (var p = 0; p < state.numPlayers; p++){ state.players.push('プレイヤー' + (p + 1)); }
    state.currentPlayerIndex = 0;
    state.angryIndex = Math.floor(Math.random() * state.numCells);
    state.openedSafe = 0;
    state.ended = false;

    renderGrid();
    updateTurnUI();
    updateRemainUI();
    showScreen('screen-playing');
  }

  function renderGrid(){
    els.crateGrid.innerHTML = '';
    var cols = Math.round(Math.sqrt(state.numCells));
    els.crateGrid.style.setProperty('--cols', cols);
    for (var i = 0; i < state.numCells; i++){
      els.crateGrid.appendChild(createCell(i));
    }
  }

  function createCell(index){
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'cell';
    btn.setAttribute('data-index', index);
    btn.setAttribute('aria-label', 'おじさんの顔 ' + (index + 1));
    var tilt = ((index % 5) - 2) * 0.8;
    btn.style.setProperty('--tilt', tilt + 'deg');
    btn.innerHTML =
      '<span class="cell-content">' +
        '<span class="speech-bubble" aria-hidden="true"></span>' +
        '<span class="face-wrap"><img class="face-img" alt="顔" src="' + state.normalFaceSrc + '"></span>' +
      '</span>' +
      '<span class="cell-empty" aria-hidden="true">💨</span>';
    btn.addEventListener('click', function(){
      handleCellClick(parseInt(this.getAttribute('data-index'), 10), this);
    });
    return btn;
  }

  function handleCellClick(index, btn){
    if (state.ended) return;
    if (btn.classList.contains('is-done') || btn.classList.contains('is-flying') || btn.classList.contains('is-angry')) return;

    var isAngry = (index === state.angryIndex);
    var img = btn.querySelector('.face-img');

    if (isAngry){
      // タップ瞬間に怒り顔＋シェイク。以降他の顔はタップ不可
      state.ended = true;
      img.src = state.angryFaceSrc;
      btn.classList.add('is-angry');
      playBuzzer();
      vibrate([120, 60, 120, 60, 200]);
      document.body.classList.add('is-shaking');
      setTimeout(function(){ document.body.classList.remove('is-shaking'); }, 450);
      setTimeout(function(){ showResult(); }, 600);
    } else {
      // タップ瞬間に「おじさん」声＋吹き出し＋上へスライド（画面外まで）
      btn.classList.add('is-reacting');
      var bubble = btn.querySelector('.speech-bubble');
      bubble.textContent = REACTIONS[Math.floor(Math.random() * REACTIONS.length)];
      playPop();
      speakOjisan();

      // 元の顔の位置を取得して固定クローンを作り、CSSアニメで画面外までスライド
      var faceEl = btn.querySelector('.face-wrap') || btn.querySelector('.face-img');
      var rect = faceEl.getBoundingClientRect();
      var fly = document.createElement('img');
      fly.src = img.src || state.normalFaceSrc;
      fly.className = 'flying-face-clone';
      fly.style.left = rect.left + 'px';
      fly.style.top = rect.top + 'px';
      fly.style.width = rect.width + 'px';
      fly.style.height = rect.height + 'px';
      document.body.appendChild(fly);

      // 元のセルは空にする
      btn.classList.add('is-flying');
      btn.classList.add('is-done');

      setTimeout(function(){
        if (fly.parentNode) fly.parentNode.removeChild(fly);
        state.openedSafe++;
        updateRemainUI();
        nextPlayer();
      }, 1500);
    }
  }

  function nextPlayer(){
    if (state.numPlayers <= 1) return;
    state.currentPlayerIndex = (state.currentPlayerIndex + 1) % state.numPlayers;
    updateTurnUI();
  }

  function updateTurnUI(){
    if (state.numPlayers > 1){
      els.turnBadge.hidden = false;
      els.turnLabel.textContent = state.players[state.currentPlayerIndex];
      els.turnBadge.style.background = PLAYER_COLORS[state.currentPlayerIndex % PLAYER_COLORS.length];
    } else {
      els.turnBadge.hidden = true;
    }
  }

  function updateRemainUI(){
    var remain = state.numCells - state.openedSafe;
    els.remainCount.textContent = remain;
  }

  function showResult(){
    state.ended = true;
    els.resultFace.src = state.angryFaceSrc;
    // ゲーム中画面を背景に残したまま、怒った顔だけオーバーレイ表示
    var result = document.getElementById('screen-result');
    result.classList.add('is-active');
    // 全画面表示と同時に「許さない、許さないからな！」＋揺れ
    var wrap = document.querySelector('.result-face-wrap');
    if (wrap) {
      wrap.classList.remove('is-shaking-result');
      void wrap.offsetWidth;
      wrap.classList.add('is-shaking-result');
    }
    speakYurusanai();
  }

  // 全画面の怒った顔をタップでトップに戻る
  document.getElementById('screen-result').addEventListener('click', function(){
    document.getElementById('screen-result').classList.remove('is-active');
    showScreen('screen-top');
  });

})();
</script>
